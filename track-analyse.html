<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track-Analyse</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --ink:#17212b; --muted:#65727d; --paper:#f4f1eb; --panel:#fffdf9; --line:#ddd8cf; --teal:#087f78; --coral:#d85c4a; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(145deg,#f4f1eb,#e6efeb); font-family:Manrope,Arial,sans-serif; }
    body::before { content:""; display:block; height:8px; background:linear-gradient(90deg,var(--teal) 0 62%,#f3c969 62% 79%,var(--coral) 79%); }
    main { max-width:1220px; margin:0 auto; padding:42px 24px 60px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:26px; }
    .kicker { color:var(--teal); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
    h1 { margin:8px 0 0; font-size:clamp(34px,5vw,60px); line-height:1; }
    .intro { max-width:360px; color:var(--muted); line-height:1.6; margin:0; }
    .panel { background:rgba(255,253,249,.9); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px #342b1b12; }
    .upload { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:20px; margin-bottom:18px; }
    .drop { display:block; flex:1; border:1.5px dashed #9ab8b3; background:#edf6f3; border-radius:5px; padding:16px; cursor:pointer; }
    .drop strong { display:block; margin-bottom:4px; }
    .drop small { color:var(--muted); }
    input[type=file] { display:none; }
    .file-info { color:var(--muted); font-size:13px; }
    .dashboard { display:none; }
    .dashboard.show { display:block; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
    .stat { padding:20px; border-right:1px solid var(--line); }
    .stat:last-child { border:0; }
    .stat b { display:block; font-size:24px; }
    .stat span { color:var(--muted); font-size:12px; }
    .track-title { padding:22px 24px 0; }
    .track-title h2 { margin:0; font-size:21px; }
    .status { color:var(--muted); font-size:12px; margin-top:5px; }
    #trackMap { height:480px; margin:18px 24px 24px; border-radius:6px; background:#dce9e5; }
    .chart-section { padding:22px 24px 26px; border-top:1px solid var(--line); }
    .chart-section h3 { margin:0 0 12px; font-size:16px; }
    .chart-wrap { height:310px; }
    #speedChart { width:100%; height:100%; }
    @media (max-width:700px) { main{padding:30px 14px 45px} header{display:block} .intro{margin-top:16px} .upload{display:block} .file-info{margin-top:12px} .stats{grid-template-columns:repeat(2,1fr)} .stat:nth-child(2){border-right:0} .stat:nth-child(-n+2){border-bottom:1px solid var(--line)} #trackMap{height:330px;margin:18px 12px 18px}.track-title{padding:18px 12px 0}.chart-section{padding:18px 12px 22px}.chart-wrap{height:250px} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="kicker">GMX / GPX TRACK-ANALYSE</div><h1>Deine Strecke im Blick.</h1></div>
      <p class="intro">Lade eine Trackdatei und erhalte Karte, Geschwindigkeitsverlauf und die wichtigsten Kennzahlen.</p>
    </header>
    <section class="panel upload">
      <label class="drop" for="fileInput"><strong>Datei öffnen</strong><small>.gmx oder .gpx auswählen oder hier ablegen</small></label>
      <input id="fileInput" type="file" accept=".gmx,.gpx,application/xml,text/xml">
      <div id="fileInfo" class="file-info">Noch keine Datei geladen.</div>
    </section>
    <section id="dashboard" class="panel dashboard">
      <div class="stats">
        <div class="stat"><b id="distance">–</b><span>Streckenlänge</span></div>
        <div class="stat"><b id="averageSpeed">–</b><span>Durchschnittsgeschwindigkeit</span></div>
        <div class="stat"><b id="duration">–</b><span>Dauer</span></div>
        <div class="stat"><b id="maxSpeed">–</b><span>Max-Geschwindigkeit</span></div>
      </div>
      <div class="track-title"><h2 id="trackTitle">Track</h2><div id="status" class="status"></div></div>
      <div id="trackMap"></div>
      <div class="chart-section"><h3>Geschwindigkeitsverlauf</h3><div class="chart-wrap"><canvas id="speedChart"></canvas></div></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let map = null, line = null, chart = null;
    const elements = (element, name) => element?.getElementsByTagNameNS ? [...element.getElementsByTagNameNS('*', name)] : [];
    const text = (element, name) => elements(element, name)[0]?.textContent.trim() || '';
    const haversine = (first, second) => {
      const radians = value => value * Math.PI / 180;
      const lat1 = Number(first.getAttribute('lat')), lon1 = Number(first.getAttribute('lon'));
      const lat2 = Number(second.getAttribute('lat')), lon2 = Number(second.getAttribute('lon'));
      if (![lat1, lon1, lat2, lon2].every(Number.isFinite)) return 0;
      const dLat = radians(lat2 - lat1), dLon = radians(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(radians(lat1)) * Math.cos(radians(lat2)) * Math.sin(dLon / 2) ** 2;
      return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    };
    const formatDuration = milliseconds => { const minutes = Math.round(milliseconds / 60000); return `${Math.floor(minutes / 60)} h ${String(minutes % 60).padStart(2, '0')} min`; };
    function load(file) { const reader = new FileReader(); reader.onload = () => parse(reader.result, file.name); reader.onerror = () => $('fileInfo').textContent = 'Datei konnte nicht gelesen werden.'; reader.readAsText(file); }
    function parse(source, fileName) {
      const xml = new DOMParser().parseFromString(String(source).replace(/<\?xml[^>]*\?>/gi, '').trim(), 'application/xml');
      if (xml.querySelector('parsererror') || xml.documentElement?.localName !== 'gpx') return $('fileInfo').textContent = 'Keine gültige GPX/GMX-XML-Datei.';
      const track = elements(xml, 'trk')[0];
      const points = track ? elements(track, 'trkpt') : [];
      const timed = points.map(point => ({ point, date: new Date(text(point, 'time')) })).filter(entry => Number.isFinite(entry.date.valueOf()));
      if (points.length < 2) return $('fileInfo').textContent = 'Die Datei enthält zu wenige Trackpunkte.';
      const segments = points.slice(1).map((point, index) => ({ distance: haversine(points[index], point), milliseconds: timed.length === points.length ? timed[index + 1].date - timed[index].date : 0, point, date: timed[index + 1]?.date })).filter(segment => segment.milliseconds > 0);
      const totalDistance = points.slice(1).reduce((sum, point, index) => sum + haversine(points[index], point), 0);
      const speeds = segments.map(segment => segment.distance / (segment.milliseconds / 3600000)).filter(Number.isFinite);
      const duration = timed.length > 1 ? timed.at(-1).date - timed[0].date : 0;
      $('fileInfo').textContent = `${fileName} · ${points.length} Trackpunkte`;
      $('trackTitle').textContent = text(track, 'name') || fileName;
      $('status').textContent = timed.length > 1 ? `${timed[0].date.toLocaleString('de-DE')} bis ${timed.at(-1).date.toLocaleString('de-DE')}` : 'Keine ausreichenden Zeitstempel für Geschwindigkeiten';
      $('distance').textContent = `${totalDistance.toFixed(2)} km`;
      $('averageSpeed').textContent = duration > 0 ? `${(totalDistance / (duration / 3600000)).toFixed(2)} km/h` : '–';
      $('duration').textContent = duration > 0 ? formatDuration(duration) : '–';
      $('maxSpeed').textContent = speeds.length ? `${Math.max(...speeds).toFixed(2)} km/h` : '–';
      $('dashboard').classList.add('show');
      renderMap(points); renderChart(segments);
    }
    function renderMap(points) {
      if (!map) map = L.map('trackMap').setView([51.1657, 10.4515], 6);
      if (!line) L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
      line?.remove();
      const coordinates = points.map(point => [Number(point.getAttribute('lat')), Number(point.getAttribute('lon'))]).filter(([lat, lon]) => Number.isFinite(lat) && Number.isFinite(lon));
      line = L.polyline(coordinates, { color:'#087f78', weight:4 }).addTo(map);
      map.fitBounds(line.getBounds(), { padding:[20,20] });
      setTimeout(() => map.invalidateSize(), 0);
    }
    function renderChart(segments) {
      chart?.destroy();
      chart = new Chart($('speedChart'), { type:'line', data:{ labels:segments.map(segment => segment.date ? segment.date.toLocaleTimeString('de-DE') : ''), datasets:[{ data:segments.map(segment => Number((segment.distance / (segment.milliseconds / 3600000)).toFixed(2))), borderColor:'#d85c4a', backgroundColor:'#d85c4a22', fill:true, pointRadius:segments.length > 100 ? 0 : 2, tension:.2 }] }, options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, scales:{x:{ticks:{maxTicksLimit:8}},y:{beginAtZero:true,title:{display:true,text:'km/h'}}}, plugins:{legend:{display:false}} } });
    }
    $('fileInput').addEventListener('click', event => event.target.value = '');
    $('fileInput').addEventListener('change', event => event.target.files[0] && load(event.target.files[0]));
    const drop = document.querySelector('.drop');
    ['dragenter','dragover'].forEach(type => drop.addEventListener(type, event => { event.preventDefault(); drop.style.borderColor = 'var(--teal)'; }));
    ['dragleave','drop'].forEach(type => drop.addEventListener(type, event => { event.preventDefault(); drop.style.borderColor = ''; }));
    drop.addEventListener('drop', event => event.dataTransfer.files[0] && load(event.dataTransfer.files[0]));
  </script>
</body>
</html>
